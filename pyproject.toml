[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "work2030"
version = "0.1.0"
description = "CRTHON 10 experimental workspace"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.1", "uvicorn==0.41.0", "mcp==1.26.0", "httpx==0.28.1", "python-dotenv==1.2.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]
